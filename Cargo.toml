[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Cameron Kruger <ckruger4@gmu.edu>"]

[workspace.dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
